<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventTicket - Схема зала</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <div id="globalLoader" class="loader-overlay hidden-loader">
        <div>
            <div class="spinner"></div>
        </div>
    </div>

    <div id="paymentModal" class="modal-overlay hidden-loader">
        <div class="modal">
            <div class="modal-title">Оформление билета</div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="firstName" placeholder="Введите имя">
                </div>
                <div class="form-group">
                    <label>Фамилия</label>
                    <input type="text" id="lastName" placeholder="Введите фамилию">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Введите email">
                </div>
                <div class="form-group">
                    <label>Способ оплаты</label>
                    <select id="paymentMethod">
                        <option value="card">Банковская карта</option>
                        <option value="sbp">СБП</option>
                        <option value="crypto">Криптовалюта</option>
                    </select>
                </div>
                <div class="modal-seat-info" id="modalSeatInfo"></div>
            </div>
            <div class="modal-actions">
                <button id="cancelPaymentBtn">Отмена</button>
                <button id="confirmPaymentBtn">Оплатить</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="venue-section">
            <div class="event-selector">
                <select id="eventSelect">
                    <option value="">Загрузка событий...</option>
                </select>
            </div>
            <div class="venue-title" id="venueTitle">Загрузка...</div>
            <div class="stage">СЦЕНА</div>
            <div class="seat-grid" id="seatGrid"></div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color legend-parter"></div>
                    <span id="parterLegend">Партер</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-balcony"></div>
                    <span id="balconyLegend">Балкон</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-vip"></div>
                    <span id="vipLegend">VIP</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-blocked"></div>
                    <span>Заблокировано</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-sold"></div>
                    <span>Продано</span>
                </div>
            </div>
            <div class="demand-info">
                <div>Продано мест: <span id="soldCount">0</span> / <span id="totalCount">0</span></div>
                <div>Коэффициент спроса: <span id="demandCoefficient">1.0</span>x</div>
            </div>

            <div class="refund-info">
                <div class="refund-header">УСЛОВИЯ ВОЗВРАТА</div>
                <table class="refund-table">
                    <tr>
                        <td>Более 72ч до события</td>
                        <td><span class="percentage-badge">5%</span> комиссия</td>
                    </tr>
                    <tr>
                        <td>24–72ч до события</td>
                        <td><span class="percentage-badge">15%</span> комиссия</td>
                    </tr>
                    <tr>
                        <td>2–24ч до события</td>
                        <td><span class="percentage-badge">30%</span> комиссия</td>
                    </tr>
                    <tr>
                        <td>Менее 2ч до события</td>
                        <td><span class="percentage-badge">50%</span> комиссия</td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="info-section">
            <div class="info-panel" id="infoPanel">
                <div class="info-placeholder">Выберите место на схеме</div>
            </div>
            <div class="actions" id="actions" style="display: none;">
                <button id="reserveBtn">Забронировать</button>
                <button id="buyBtn">Купить билет</button>
                <button id="refundBtn">Вернуть билет</button>
            </div>
            <div class="result" id="result"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
